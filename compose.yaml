# HomeFit with PostgreSQL. Copy .env.example to .env, fill in the secrets, then:
#
#   docker compose up -d --build        # app on http://127.0.0.1:3000
#   bun run db:start                    # publish the database for `bun run dev`
#
# The database listens only on the Compose network. compose.dev.yaml publishes it
# on 127.0.0.1 for development on this machine. Agents use compose.test.yaml.
name: homefit

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-homefit}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: homefit:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # The app builds its connection string from the user, password, and database name.
      # Inside Compose the database is the `db` service on its container port, not the
      # published host port.
      POSTGRES_USER: ${POSTGRES_USER:-homefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-homefit}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    # Loopback only by default, so a reverse proxy on the host is the only way in. Set
    # APP_BIND_ADDRESS=0.0.0.0 to serve other machines directly (then leave ADDRESS_HEADER unset).
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'

volumes:
  pgdata:
