<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%" class="overflow-x-clip">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script nonce="%sveltekit.nonce%">
			// Initialize mode before paint; ModeWatcher resumes tracking after hydration.
			try {
				var storedMode = localStorage.getItem('mode-watcher-mode');
				var dark =
					storedMode === 'dark' ||
					(storedMode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				var themeColor = document.querySelector('meta[name="theme-color"]');
				if (themeColor) themeColor.content = dark ? '#121721' : '#f5f7f9';
			} catch {}
			try {
				var timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
				if (timeZone) {
					document.cookie =
						'tz=' + encodeURIComponent(timeZone) + '; path=/; max-age=31536000; samesite=lax';
				}
			} catch (error) {
				/* The server falls back to UTC when the cookie cannot be set. */
			}
		</script>
	</head>

	<body data-sveltekit-preload-data="hover" class="overflow-x-clip">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
